########## STRESS TESTS ##########
stress_test:
  stage: sanitizer-test
  parallel:
    matrix:
      - SANITIZER: ['asan', 'ubsan', 'tsan', 'msan']
  needs:
    - job: build_with_sanitizer
      artifacts: true
    - job: check_pipeline_already_running
      artifacts: true
  image: harbor.internal.moqi.ai/mqdb/mqdb-test-stress:3.0.0
  tags:
    - ${SANITIZER}
  artifacts:
    name: "mqdb-$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA-stress${SANITIZER}"
    paths:
      - $CI_PROJECT_DIR/docker/test/myscale_stress/test_output
    when: always
  script:
    - pwd && echo $CI_PROJECT_DIR && echo ${CI_COMMIT_SHA}
    - docker/myscale_test_script/stress-test.sh
    - docker/myscale_test_script/check-job-states.sh myscale_stress
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_TEST_IN_K8S == "false"' # Trigger pipline during scheduled tasks
    - if: '$CI_MERGE_REQUEST_LABELS =~ /sanitizer-test/'

vector-test:
  stage: sanitizer-test
  parallel:
    matrix:
      # - SANITIZER: ['asan', 'ubsan', 'tsan', 'msan']
      - SANITIZER: ['asan', 'ubsan']
  needs:
    - job: build_with_sanitizer
      artifacts: true
    - job: check_pipeline_already_running
      artifacts: true
  image: harbor.internal.moqi.ai/mqdb/mqdb-test-stateless:3.0.0
  tags:
    - ${SANITIZER}
  artifacts:
    name: "mqdb-$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA-vector${SANITIZER}"
    paths:
      - $CI_PROJECT_DIR/docker/test/myscale_stateless/test_output
    when: always
  before_script:
    - if [[ -f previous_pipeline_status.txt ]]; then
      exit 0;
      fi
  script:
    - pwd && echo $CI_PROJECT_DIR && echo ${CI_COMMIT_SHA}
    - docker/myscale_test_script/stateless-test.sh true
    - STATUS=$(cat docker/test/myscale_stateless/test_output/check_status.tsv| awk '{print $2}'| awk -F, '{print $1}')
    - if [[ $STATUS == "Timeout" ]]; then cat docker/test/myscale_stateless/test_output/check_status.tsv; exit 1; fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_TEST_IN_K8S == "false"' # Trigger pipline during scheduled tasks
    - if: '$CI_MERGE_REQUEST_LABELS =~ /sanitizer-test/'

