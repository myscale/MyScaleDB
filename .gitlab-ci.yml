image: harbor.internal.moqi.ai/mqdb/builder:2.8

stages:
  - build
  - vs_test
  - test
  - package
  - image
  - deploy
  - benchmark

style_check:
  stage: build
  image: harbor.internal.moqi.ai/mqdb/style-check
  artifacts:
    name: "mqdb-$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA"
    paths:
      - test_output/*
  script:
    - docker/builder/tools/run-style-check.sh

build_binary:
  stage: build
  variables:
    KUBERNETES_CPU_REQUEST: 8
    KUBERNETES_CPU_LIMIT: 32
    KUBERNETES_MEMORY_REQUEST: 16Gi
    KUBERNETES_MEMORY_LIMIT: 32Gi
  artifacts:
    name: "mqdb-$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA"
    paths:
      - artifacts/*.deb
  retry: 2
  script:
    - ssh-keyscan -H git.moqi.ai > ~/.ssh/known_hosts
    - docker/builder/tools/submodule-update.sh
    - docker/builder/build.py --output artifacts --arch linux-x86_64 --package --compiler "clang-15"
    # - docker/builder/build.py --output artifacts --arch linux-aarch64 --package --compiler "clang-15"

vector_search_test:
  stage: vs_test
  dependencies: ["build_binary"]
  parallel:
    matrix:
      - ARCH: amd64
      # - ARCH: arm64
  tags:
    - ${ARCH}
  before_script:
    - docker/builder/tools/docker-info.sh
  script:
    - docker/builder/tools/vector-search-test.sh

stateless_test:
  stage: test
  dependencies: ["build_binary"]
  parallel:
    matrix:
      - ARCH: amd64
      # - ARCH: arm64
  tags:
    - ${ARCH}
  artifacts:
    name: "mqdb-$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA-stateless-test"
    paths:
      - $CI_PROJECT_DIR/docker/test/mqdb_run_stateless/test_output
    when: always
  before_script:
    - docker/builder/tools/docker-info.sh
  script:
    - docker/builder/tools/stateless-test.sh
    - if [[ ${ARCH} == "amd64" ]];then docker/builder/tools/check_job_states.sh mqdb_run_stateless; fi

stateful_test:
  stage: test
  dependencies: ["build_binary"]
  parallel:
    matrix:
      - ARCH: amd64
      # - ARCH: arm64
  tags:
    - ${ARCH}
  artifacts:
    name: "mqdb-$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA-stateful-test"
    paths:
      - $CI_PROJECT_DIR/docker/test/mqdb_run_stateful/test_output
    when: always
  before_script:
    - docker/builder/tools/docker-info.sh
  script:
    - docker/builder/tools/stateful-test.sh
    - if [[ ${ARCH} == "amd64" ]];then docker/builder/tools/check_job_states.sh mqdb_run_stateful; fi

build_package:
  stage: package
  dependencies: []
  variables:
    KUBERNETES_CPU_REQUEST: 8
    KUBERNETES_CPU_LIMIT: 32
    KUBERNETES_MEMORY_REQUEST: 16Gi
    KUBERNETES_MEMORY_LIMIT: 32Gi
  only:
    - mqdb-master
    - mqdb-staging
    - mqdb-dev
  artifacts:
    name: "mqdb-$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA-without-license"
    paths:
      - artifacts/*.tgz
  retry: 2
  script:
    - ssh-keyscan -H git.moqi.ai >> ~/.ssh/known_hosts
    - docker/builder/tools/submodule-update.sh
    - docker/builder/build.py --output artifacts --profile release --arch linux-x86_64 --package --compiler "clang-15"
    # - docker/builder/build.py --output artifacts --profile release --arch linux-aarch64 --package --compiler "clang-15"

build_package_with_license:
  stage: package
  dependencies: []
  variables:
    KUBERNETES_CPU_REQUEST: 8
    KUBERNETES_CPU_LIMIT: 32
    KUBERNETES_MEMORY_REQUEST: 16Gi
    KUBERNETES_MEMORY_LIMIT: 32Gi
  only:
    - mqdb-master
    - mqdb-staging
  artifacts:
    name: "mqdb-$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA-with-license"
    paths:
      - artifacts/*.tgz
  retry: 2
  script:
    - ssh-keyscan -H git.moqi.ai >> ~/.ssh/known_hosts
    - docker/builder/tools/submodule-update.sh
    - docker/builder/build.py --output artifacts --profile release_with_license --arch linux-x86_64 --package --compiler "clang-15"
    # - docker/builder/build.py --output artifacts --profile release_with_license --arch linux-aarch64 --package --compiler "clang-15"

build_image:
  stage: image
  dependencies: ["build_package"]
  only:
    - mqdb-master
    - mqdb-staging
    - mqdb-dev
  before_script:
    - docker/builder/tools/docker-info.sh
    - docker/builder/tools/docker-buildx.sh
  script:
    - docker/builder/tools/image.sh
