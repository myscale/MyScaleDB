image: harbor.internal.moqi.ai/mqdb/builder:2.8

# workflow:
#   rules:
#     - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
#     - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
#     - if: '$CI_PIPELINE_SOURCE == "schedule"'

include:
  - "/.gitlab-ci-build.yml"
  - "/.gitlab-ci-functional-test.yml"
  - "/.gitlab-ci-integration-test.yml"
  - "/.gitlab-ci-sanitizer-test.yml"
  - "/.gitlab-ci-performance-test.yml"

stages:
  - check-pipeline
  - build
  - functional-test
  - performance-test
  - failover-test
  - sanitizer-test
  - package
  - image
  - deploy
  - benchmark

check_pipeline_already_running:
  stage: check-pipeline
  cache:
    key: $CI_PIPELINE_SOURCE-$CI_COMMIT_SHA-$CI_TEST_VECTOR_DB
    paths:
      - .schedule_cache
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - if [[ -f .schedule_cache ]]; then
      echo "already ran for this commit, nothing to do";
      exit 1;
      fi
    - echo "done" > .schedule_cache

style_check:
  stage: build
  image: harbor.internal.moqi.ai/mqdb/style-check
  artifacts:
    name: "mqdb-$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA"
    paths:
      - test_output/*
  script:
    - docker/builder/tools/run-style-check.sh

build_package:
  stage: package
  when: manual
  dependencies: []
  variables:
    KUBERNETES_CPU_REQUEST: 8
    KUBERNETES_CPU_LIMIT: 32
    KUBERNETES_MEMORY_REQUEST: 16Gi
    KUBERNETES_MEMORY_LIMIT: 32Gi
  artifacts:
    name: "mqdb-$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA-without-license"
    paths:
      - artifacts/*.tgz
  retry: 2
  script:
    - ssh-keyscan -H git.moqi.ai >> ~/.ssh/known_hosts
    - docker/builder/tools/submodule-update.sh
    - docker/builder/build.py --output artifacts --profile release --arch linux-x86_64 --package --compiler "clang-15"
    # - docker/builder/build.py --output artifacts --profile release --arch linux-aarch64 --package --compiler "clang-15"

build_package_with_license:
  stage: package
  when: manual
  dependencies: []
  variables:
    KUBERNETES_CPU_REQUEST: 8
    KUBERNETES_CPU_LIMIT: 32
    KUBERNETES_MEMORY_REQUEST: 16Gi
    KUBERNETES_MEMORY_LIMIT: 32Gi
  artifacts:
    name: "mqdb-$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA-with-license"
    paths:
      - artifacts/*.tgz
  retry: 2
  script:
    - ssh-keyscan -H git.moqi.ai >> ~/.ssh/known_hosts
    - docker/builder/tools/submodule-update.sh
    - docker/builder/build.py --output artifacts --profile release_with_license --arch linux-x86_64 --package --compiler "clang-15"
    # - docker/builder/build.py --output artifacts --profile release_with_license --arch linux-aarch64 --package --compiler "clang-15"

build_image:
  stage: image
  when: manual
  dependencies: ["build_package"]
  before_script:
    - docker/builder/tools/docker-info.sh
    - docker/builder/tools/docker-buildx.sh
  script:
    - docker/builder/tools/image.sh

build_saas_image:
  stage: image
  when: manual
  dependencies: ["build_package"]
  before_script:
    - docker/builder/tools/docker-info.sh
    - docker/builder/tools/docker-buildx.sh
  script:
    - docker/builder/tools/saas-image.sh

upload_performance_file_to_s3:
  stage: deploy
  dependencies: ["build_binary"]
  image:
    name: minio/mc
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  before_script:
    - mkdir -pv ~/.mc
    - cp -fv $mc_config ~/.mc/config.json
  script:
    # - mc cp artifacts/performance_pack_amd64.tar.gz cos/mqdb-release-1253802058/performance/performance_pack_amd64_${CI_COMMIT_SHORT_SHA}.tar.gz
    - mc cp artifacts/performance_pack_amd64.tar.gz cos/mqdb-release-1253802058/performance/performance_pack_amd64.tar.gz