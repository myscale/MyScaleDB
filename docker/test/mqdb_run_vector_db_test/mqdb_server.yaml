apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: "testing"
  namespace: "vector-db-ci"
spec:
  defaults:
    templates:
      serviceTemplate: service-template
      replicaServiceTemplate: replica-service-template
      podTemplate: pod-template
      dataVolumeClaimTemplate: data-volume-claim-template
      logVolumeClaimTemplate: log-volume-claim-template

  configuration:
    settings:
      logger/level: error
      logger/size: 2000M
      logger/count: 100
      max_concurrent_queries: 10000
      merge_tree/min_rows_to_build_vector_index: 0
      query_log/database: system
      query_log/table: query_log
      query_log/partition_by: toYYYYMMDD(event_date)
      query_log/ttl: event_date + INTERVAL 3 DAY DELETE
      query_log/flush_interval_milliseconds: 7500
    users:
      default/networks/ip:
        - "127.0.0.1"
        - "::1"
        - "0.0.0.0/0"
    profiles:
      default/allow_experimental_lightweight_delete: true
      default/mutations_sync: 1
      default/log_query_threads: 0
      default/log_queries_cut_to_length: 1000
    clusters:
      - name: "testing"
        layout:
          shardsCount: 1
          replicasCount: 1
  templates:
    serviceTemplates:
      - name: service-template
        metadata:
          annotations:
            # service.kubernetes.io/qcloud-loadbalancer-internal-subnetid: subnet-ezx6t8lt
            # service.kubernetes.io/qcloud-loadbalancer-internal-subnetid: subnet-q5eu0w59
            service.kubernetes.io/qcloud-loadbalancer-internal-subnetid: subnet-itzzzhyz
        spec:
          type: LoadBalancer
          ports:
            - name: http
              port: 8123
              protocol: TCP
              targetPort: http
            - name: tcp
              port: 9000
              protocol: TCP
              targetPort: tcp
            - name: ssh
              port: 22
              protocol: TCP
              targetPort: ssh
      - name: replica-service-template
        spec:
          type: ClusterIP
          clusterIP: None
          ports:
            - name: http
              port: 8123
              protocol: TCP
              targetPort: http
            - name: tcp
              port: 9000
              protocol: TCP
              targetPort: tcp
            - name: interserver
              port: 9009
              protocol: TCP
              targetPort: interserver
            - name: metrics
              port: 9363
              protocol: TCP
              targetPort: metrics
    podTemplates:
      - name: pod-template
        spec:
          containers:
            - name: clickhouse
              image: harbor.internal.moqi.ai/mqdb/mqdb:IMAGE_VERSION
              # image: harbor.internal.moqi.ai/mqdb/mqdb:22.3.7.5-dc6971d6e
              ports:
                - containerPort: 9000
                  name: tcp
                  protocol: TCP
                - containerPort: 8123
                  name: http
                  protocol: TCP
                - containerPort: 9009
                  name: interserver
                  protocol: TCP
                - containerPort: 9363
                  name: metrics
                  protocol: TCP
              resources:
                requests:
                  cpu: 4
                  memory: 8Gi
                limits:
                  cpu: 4
                  memory: 8Gi
          volumes:
            - name: ssh
              configMap:
                name: ssh
                defaultMode: 0600

    volumeClaimTemplates:
      - name: data-volume-claim-template
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 200Gi
      - name: log-volume-claim-template
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi